<div class="flex h-screen bg-gradient-to-b from-slate-950 via-slate-900 to-slate-950 overflow-hidden text-slate-300 relative">

  <!-- Mobile Header (Visible only on mobile) -->
  <div
    class="md:hidden flex items-center justify-between h-16 px-4 bg-slate-900 border-b border-slate-800 shrink-0 absolute top-0 inset-x-0 z-30">
    <div class="flex items-center gap-3">
      <div class="flex h-8 w-8 items-center justify-center rounded-lg bg-emerald-500 text-white shadow-sm">
        <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
          stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" />
        </svg>
      </div>
      <span class="text-xl font-bold text-white tracking-tight">Turky's Gym</span>
    </div>
    <button (click)="toggleMobileMenu()" class="p-2 text-slate-400 hover:text-white focus:outline-none">
      <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
        stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
  </div>

  <!-- Overlay for Mobile -->
  @if (isMobileOpen()) {
  <div (click)="closeMobileMenu()" class="fixed inset-0 z-40 bg-black/50 md:hidden backdrop-blur-sm transition-opacity">
  </div>
  }

  <!-- Sidebar -->
  <aside [ngClass]="{
      'translate-x-0': isMobileOpen(),
      '-translate-x-full': !isMobileOpen()
    }" class="fixed md:static inset-y-0 left-0 z-50 flex flex-col bg-slate-900 border-r border-slate-800 transition-all duration-300 ease-in-out
           md:translate-x-0 w-64 md:w-[72px] hover:w-64 group overflow-hidden">
    <!-- Brand / Logo -->
    <div class="h-16 flex items-center px-[19px] border-b border-slate-800 shrink-0">
      <div class="flex items-center gap-4 w-full">
        <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-lg bg-emerald-500 text-white shadow-sm">
          <svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2"
            stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M3.75 13.5l10.5-11.25L12 10.5h8.25L9.75 21.75 12 13.5H3.75z" />
          </svg>
        </div>
        <!-- Hide text when collapsed on desktop, show on hover or mobile -->
        <span
          class="text-xl font-bold text-white tracking-tight whitespace-nowrap opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity duration-300">
          Turky's Gym
        </span>
      </div>
    </div>

    <!-- Nav Links -->
    <nav class="flex-1 overflow-y-auto px-3 py-6 space-y-2 overflow-x-hidden">
      <!-- Dashboard -->
      <a routerLink="/dashboard" routerLinkActive="bg-emerald-500/10 text-emerald-400"
        [routerLinkActiveOptions]="{ exact: false }" (click)="closeMobileMenu()"
        class="flex items-center gap-4 px-3 py-3 rounded-xl font-medium text-sm transition-colors hover:bg-slate-800 hover:text-white relative"
        title="Dashboard">
        <svg class="h-6 w-6 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
          stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z" />
        </svg>
        <span
          class="whitespace-nowrap opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity duration-300">
          Dashboard
        </span>
      </a>

      <!-- Recepción -->
      <a routerLink="/reception" routerLinkActive="bg-emerald-500/10 text-emerald-400"
        [routerLinkActiveOptions]="{ exact: false }" (click)="closeMobileMenu()"
        class="flex items-center gap-4 px-3 py-3 rounded-xl font-medium text-sm transition-colors hover:bg-slate-800 hover:text-white relative"
        title="Recepción">
        <svg class="h-6 w-6 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
          stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z" />
        </svg>
        <span
          class="whitespace-nowrap opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity duration-300">Recepción</span>
      </a>

      <!-- Directorio -->
      <a routerLink="/clients" routerLinkActive="bg-emerald-500/10 text-emerald-400"
        [routerLinkActiveOptions]="{ exact: false }" (click)="closeMobileMenu()"
        class="flex items-center gap-4 px-3 py-3 rounded-xl font-medium text-sm transition-colors hover:bg-slate-800 hover:text-white relative"
        title="Directorio">
        <svg class="h-6 w-6 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
          stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z" />
        </svg>
        <span
          class="whitespace-nowrap opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity duration-300">Directorio</span>
      </a>

      <!-- Caja -->
      <a routerLink="/cash-register" routerLinkActive="bg-emerald-500/10 text-emerald-400"
        [routerLinkActiveOptions]="{ exact: false }" (click)="closeMobileMenu()"
        class="flex items-center gap-4 px-3 py-3 rounded-xl font-medium text-sm transition-colors hover:bg-slate-800 hover:text-white relative"
        title="Caja">
        <svg class="h-6 w-6 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
          stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M2.25 18.75a60.07 60.07 0 0115.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 013 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 00-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 01-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 003 15h-.75M15 10.5a3 3 0 11-6 0 3 3 0 016 0zm3 0h.008v.008H18V10.5zm-12 0h.008v.008H6V10.5z" />
        </svg>
        <span
          class="whitespace-nowrap opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity duration-300">Caja</span>
      </a>

      <!-- Planes -->
      <a routerLink="/plans" routerLinkActive="bg-emerald-500/10 text-emerald-400"
        [routerLinkActiveOptions]="{ exact: false }" (click)="closeMobileMenu()"
        class="flex items-center gap-4 px-3 py-3 rounded-xl font-medium text-sm transition-colors hover:bg-slate-800 hover:text-white relative"
        title="Planes">
        <svg class="h-6 w-6 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
          stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z" />
        </svg>
        <span
          class="whitespace-nowrap opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity duration-300">Planes</span>
      </a>

      <!-- Inventario -->
      <a routerLink="/inventory" routerLinkActive="bg-emerald-500/10 text-emerald-400"
        [routerLinkActiveOptions]="{ exact: false }" (click)="closeMobileMenu()"
        class="flex items-center gap-4 px-3 py-3 rounded-xl font-medium text-sm transition-colors hover:bg-slate-800 hover:text-white relative"
        title="Inventario">
        <svg class="h-6 w-6 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
          stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M20.25 7.151V16.85a2.25 2.25 0 01-1.125 1.948l-6 3.464a2.25 2.25 0 01-2.25 0l-6-3.464A2.25 2.25 0 013.75 16.85V7.151a2.25 2.25 0 011.125-1.948l6-3.464a2.25 2.25 0 012.25 0l6 3.464a2.25 2.25 0 011.125 1.948z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 22.5V12M12 12l-9.375-5.417M12 12l9.375-5.417" />
        </svg>
        <span
          class="whitespace-nowrap opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity duration-300">Inventario</span>
      </a>
    </nav>

    <!-- Logout Button -->
    <div class="p-3 border-t border-slate-800 shrink-0">
      <button (click)="signOut()"
        class="w-full flex items-center gap-4 px-3 py-3 rounded-xl font-medium text-sm transition-colors hover:bg-red-500/10 hover:text-red-400 text-slate-400 relative"
        title="Cerrar Sesión">
        <svg class="h-6 w-6 shrink-0" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
          stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
        </svg>
        <span
          class="whitespace-nowrap opacity-100 md:opacity-0 group-hover:opacity-100 transition-opacity duration-300">Cerrar
          Sesión</span>
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 flex flex-col overflow-y-auto mt-16 md:mt-0 relative">
    <router-outlet></router-outlet>
  </main>
</div>
